name: Refresh index

# Re-fetches every indexed post so view counts stay current and any URL merged
# into scripts/urls.txt shows up in the gallery without a manual build.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
  push:
    branches: [main]
    paths:
      - "scripts/urls.txt"
      - "scripts/overrides.json"
      - "scripts/harvest.py"
      - "scripts/build.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Harvest posts
        run: python3 scripts/harvest.py

      - name: Build gallery and READMEs
        run: python3 scripts/build.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data docs README.md README.zh-CN.md; then
            echo "nothing changed"
            exit 0
          fi
          git add data docs README.md README.zh-CN.md
          git commit -m "chore: refresh Seedance post index"
          git push
